<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">QMD impact overview</title>
  <desc id="desc">Measured runtime health and estimated token-savings analysis for the QMD OpenClaw deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <style>
      .h1 { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .h2 { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #e5e7eb; }
      .body { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .small { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .cardLabel { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #93c5fd; }
      .num { font: 700 31px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .rowLabel { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #e5e7eb; }
      .rowHint { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .value { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #dbeafe; }
      .note { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>

  <text x="44" y="58" class="h1">QMD impact overview</text>
  <text x="44" y="84" class="body">OpenClaw + QMD deployment audit snapshot · 2026-04-22</text>
  <text x="44" y="106" class="small">Measured runtime metrics are shown separately from estimated token-savings analysis.</text>

  <text x="44" y="146" class="h2">Measured runtime status</text>

  <rect x="44" y="164" width="255" height="108" rx="18" fill="#111827" stroke="#1f2937"/>
  <text x="66" y="196" class="cardLabel">QMD health</text>
  <text x="66" y="232" class="num">Healthy</text>
  <text x="66" y="254" class="body">MCP running · health ok</text>

  <rect x="319" y="164" width="255" height="108" rx="18" fill="#111827" stroke="#1f2937"/>
  <text x="341" y="196" class="cardLabel">GPU mode</text>
  <text x="341" y="232" class="num">CUDA</text>
  <text x="341" y="254" class="body">offloading: yes</text>

  <rect x="594" y="164" width="255" height="108" rx="18" fill="#111827" stroke="#1f2937"/>
  <text x="616" y="196" class="cardLabel">Indexed / embedded</text>
  <text x="616" y="232" class="num">125 / 291</text>
  <text x="616" y="254" class="body">docs / vectors</text>

  <rect x="869" y="164" width="287" height="108" rx="18" fill="#111827" stroke="#1f2937"/>
  <text x="891" y="196" class="cardLabel">Measurement source</text>
  <text x="891" y="232" class="num" style="font-size:22px">openclaw status + qmd status</text>
  <text x="891" y="254" class="body">health endpoint + embedding result</text>

  <text x="44" y="326" class="h2">Estimated token comparison</text>
  <text x="44" y="348" class="small">Representative local docs · rough estimate by chars/4 · compares naive reread vs retrieval-first workflow</text>

  <line x1="380" y1="412" x2="1088" y2="412" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="500" x2="1088" y2="500" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="588" x2="1088" y2="588" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="676" x2="1088" y2="676" stroke="#334155" stroke-width="1"/>

  <text x="44" y="395" class="rowLabel">Full reread baseline</text>
  <text x="44" y="415" class="rowHint">Representative set reread directly without QMD narrowing</text>
  <rect x="380" y="384" width="708" height="24" rx="12" fill="#334155"/>
  <rect x="380" y="384" width="708" height="24" rx="12" fill="url(#blue)"/>
  <text x="1104" y="401" class="value">3585</text>

  <text x="44" y="483" class="rowLabel">Case A</text>
  <text x="44" y="503" class="rowHint">query + README + qmd-setup + gpu-setup</text>
  <rect x="380" y="472" width="708" height="24" rx="12" fill="#334155"/>
  <rect x="380" y="472" width="472" height="24" rx="12" fill="url(#green)"/>
  <text x="1104" y="489" class="value">2392 · -33.3%</text>

  <text x="44" y="571" class="rowLabel">Case B</text>
  <text x="44" y="591" class="rowHint">query + README + gpu-setup</text>
  <rect x="380" y="560" width="708" height="24" rx="12" fill="#334155"/>
  <rect x="380" y="560" width="409" height="24" rx="12" fill="url(#green)"/>
  <text x="1104" y="577" class="value">2073 · -42.2%</text>

  <text x="44" y="659" class="rowLabel">Case C</text>
  <text x="44" y="679" class="rowHint">query + qmd-setup + deployment-notes + qmd-layer-memory</text>
  <rect x="380" y="648" width="708" height="24" rx="12" fill="#334155"/>
  <rect x="380" y="648" width="207" height="24" rx="12" fill="url(#amber)"/>
  <text x="1104" y="665" class="value">1047 · -70.8%</text>

  <text x="44" y="724" class="note">Interpretation: QMD does not eliminate LLM cost. It reduces unnecessary rereads by narrowing the candidate document set before large-context reads.</text>
  <text x="44" y="744" class="small">Use this chart as an operational estimate, not as provider billing truth.</text>
</svg>

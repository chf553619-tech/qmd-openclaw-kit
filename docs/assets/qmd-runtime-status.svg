<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">QMD runtime status</title>
  <desc id="desc">Measured runtime health snapshot for the QMD OpenClaw deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .h1 { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .h2 { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #e5e7eb; }
      .body { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .small { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .cardLabel { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #93c5fd; }
      .num { font: 700 31px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .ok { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #86efac; }
    </style>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <text x="44" y="58" class="h1">QMD runtime status</text>
  <text x="44" y="84" class="body">Measured deployment snapshot · OpenClaw + QMD · 2026-04-22</text>
  <text x="44" y="106" class="small">Source: openclaw status --deep, qmd status, QMD health endpoint, completed embedding run.</text>

  <rect x="44" y="148" width="255" height="112" rx="18" fill="#111827" stroke="#1f2937"/>
  <text x="66" y="182" class="cardLabel">Gateway</text>
  <text x="66" y="220" class="num">Reachable</text>
  <text x="66" y="244" class="body">OpenClaw gateway healthy</text>

  <rect x="319" y="148" width="255" height="112" rx="18" fill="#111827" stroke="#1f2937"/>
  <text x="341" y="182" class="cardLabel">QMD MCP</text>
  <text x="341" y="220" class="num">Running</text>
  <text x="341" y="244" class="body">health endpoint: ok</text>

  <rect x="594" y="148" width="255" height="112" rx="18" fill="#111827" stroke="#1f2937"/>
  <text x="616" y="182" class="cardLabel">GPU mode</text>
  <text x="616" y="220" class="num">CUDA</text>
  <text x="616" y="244" class="body">offloading: yes</text>

  <rect x="869" y="148" width="287" height="112" rx="18" fill="#111827" stroke="#1f2937"/>
  <text x="891" y="182" class="cardLabel">Coverage</text>
  <text x="891" y="220" class="num">125 / 291</text>
  <text x="891" y="244" class="body">indexed docs / embedded vectors</text>

  <text x="44" y="314" class="h2">Measured conclusions</text>
  <text x="44" y="344" class="ok">● QMD is healthy and queryable</text>
  <text x="44" y="368" class="ok">● CUDA acceleration is active on the WSL host</text>
  <text x="44" y="392" class="ok">● Embeddings completed successfully for the current indexed set</text>
</svg>
